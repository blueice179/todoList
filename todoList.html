<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>todoList</title>
</head>

<body>
  <div class="container">
    <h2>Todo List</h2>
    <div class="edite-event">
      <div class="add-event"><input type="text" placeholder="Add a new todo" class="input-todo"> </div>
      <div class="add-btn">+</div>
    </div>
    <div class="todo-list">
      <div class="todo-list-head">
        <h3 class="todo-title">Todo</h3>
        <div class="todo-clear"><button class="todo-clear-btn"></button></div>
      </div>
      <div class="divider-line"></div>
      <div class="todo-content">
        <ul>
          <li>1. Learn HTML</li>
        </ul>
      </div>
    </div>
    <div class="done-list">
      <div class="done-head">
        <h3 class="done-title"></h3>
        <div class="done-clear"></div>
      </div>
      <div class="divider-line"></div>
      <div class="done-content">
        <ul>
          <li>1. Learn css</li>
        </ul>
      </div>
    </div>
    <div class="footer">
      <div class="control-btn">
        <button class="clear-all"></button>
        <button class="hide-done"></button>
      </div>
    </div>
  </div>
</body>

</html>
